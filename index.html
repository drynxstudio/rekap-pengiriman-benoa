<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Material</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; --success: #2ecc71; --warning: #f1c40f; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        
        /* Tab CSS */
        .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; font-weight: bold; color: #777; transition: 0.3s; }
        .tab-btn.active { color: var(--accent); border-bottom: 3px solid var(--accent); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.5s ease; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: var(--primary); color: white; }
        
        /* Animasi Truk & Status */
        .status-badge { padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-flex; align-items: center; gap: 8px; }
        .status-otw { background-color: #fff3cd; color: #856404; }
        .status-arrived { background-color: #d4edda; color: #155724; }
        
        .truck { font-size: 16px; }
        .moving-truck { animation: drive 2s linear infinite; display: inline-block; }
        
        @keyframes drive {
            0% { transform: translateX(-5px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(15px); opacity: 0; }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Form Input */
        .update-box { background: #eef2f5; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; align-items: center; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: var(--primary); text-align: center;">Dashboard Material & Pengeluaran Pembeli</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('tab-pengiriman', this)">Rekap Pengiriman</button>
        <button class="tab-btn" onclick="openTab('tab-pesanan', this)">Status & Sisa Pesanan</button>
    </div>

    <!-- TAB 1: PENGIRIMAN -->
    <div id="tab-pengiriman" class="tab-content active">
        
        <div class="update-box">
            <strong>Update Kedatangan Barang dari Web:</strong>
            <input type="number" id="inputNo" placeholder="Masukkan NO. Pengiriman">
            <input type="date" id="inputTglSampai">
            <button onclick="updateSampai()">Konfirmasi Barang Sampai</button>
            <span id="updateStatus" style="color: var(--success); font-weight:bold; margin-left:10px;"></span>
        </div>

        <table id="tablePengiriman">
            <thead>
                <tr>
                    <th>NO</th><th>ITEM</th><th>JUMLAH</th><th>SATUAN</th><th>PENGEMUDI</th><th>TGL BERANGKAT</th><th>TGL SAMPAI</th><th>STATUS ONSITE</th>
                </tr>
            </thead>
            <tbody><!-- Dimuat via JS --></tbody>
        </table>
    </div>

    <!-- TAB 2: SISA PESANAN -->
    <div id="tab-pesanan" class="tab-content">
        <table id="tablePesanan">
            <thead>
                <tr>
                    <th>ITEM MATERIAL</th><th>TOTAL TARGET PESANAN</th><th>SUDAH TERKIRIM (SAMPAI)</th><th>SISA KEKURANGAN PESANAN</th>
                </tr>
            </thead>
            <tbody><!-- Dimuat via JS --></tbody>
        </table>
    </div>
</div>

<script>
    // GANTI DENGAN URL APPS SCRIPT ANDA
    const API_URL = 'https://script.google.com/macros/s/AKfycbx1sqFB04reLD2XM9CFJUITXSyP50hizXX4TsYfflOx9Q6SuEp0mFzuF7YfuskXWa97/exec'; 

    let globalData = {};

    function openTab(tabName, element) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        element.classList.add('active');
    }

    async function loadData() {
        document.getElementById('updateStatus').innerText = 'Memuat data...';
        const response = await fetch(API_URL);
        globalData = await response.json();
        
        renderPengiriman(globalData.pengiriman);
        renderSisaPesanan(globalData.pengiriman, globalData.pesanan);
        document.getElementById('updateStatus').innerText = '';
    }

    function renderPengiriman(data) {
        const tbody = document.querySelector('#tablePengiriman tbody');
        tbody.innerHTML = '';
        data.forEach(row => {
            const isArrived = row['TANGGAL SAMPAI'] !== "";
            const tglBerangkat = row['TANGGAL BERANGKAT'] ? new Date(row['TANGGAL BERANGKAT']).toLocaleDateString('id-ID') : '';
            const tglSampai = isArrived ? new Date(row['TANGGAL SAMPAI']).toLocaleDateString('id-ID') : '';
            
            // Logika Animasi
            let statusHtml = '';
            if(isArrived) {
                statusHtml = `<span class="status-badge status-arrived"><span class="truck">✅</span> Sampai di Site</span>`;
            } else {
                statusHtml = `<span class="status-badge status-otw"><span class="truck moving-truck">🚚</span> Sedang Dikirim</span>`;
            }

            tbody.innerHTML += `
                <tr>
                    <td><b>${row['NO']}</b></td>
                    <td>${row['ITEM']}</td>
                    <td>${row['JUMLAH']}</td>
                    <td>${row['SATUAN']}</td>
                    <td>${row['NAMA PENGEMUDI']} (${row['PLAT KENDARAAN']})</td>
                    <td>${tglBerangkat}</td>
                    <td>${tglSampai}</td>
                    <td>${statusHtml}</td>
                </tr>
            `;
        });
    }

    function renderSisaPesanan(pengiriman, masterPesanan) {
        // Kalkulasi: Hitung total barang yang SUDAH SAMPAI per ITEM
        let totalSampaiPerItem = {};
        pengiriman.forEach(row => {
            // Hanya hitung yang tanggal sampainya sudah terisi (sudah sampai di onsite)
            if(row['TANGGAL SAMPAI'] !== "") {
                const item = row['ITEM'];
                const jumlah = parseFloat(row['JUMLAH']) || 0;
                totalSampaiPerItem[item] = (totalSampaiPerItem[item] || 0) + jumlah;
            }
        });

        const tbody = document.querySelector('#tablePesanan tbody');
        tbody.innerHTML = '';
        
        masterPesanan.forEach(pesanan => {
            const item = pesanan['ITEM'];
            const target = parseFloat(pesanan['TOTAL PESANAN']) || 0;
            const terkumpul = totalSampaiPerItem[item] || 0;
            const sisa = target - terkumpul;

            // Jika sisa 0 atau minus, berarti pesanan komplit
            const statusSisa = sisa <= 0 ? `<span style="color:green; font-weight:bold;">Terkirim Semua 🎉</span>` : `<span style="color:red; font-weight:bold;">Kurang ${sisa.toFixed(2)}</span>`;

            tbody.innerHTML += `
                <tr>
                    <td><b>${item}</b></td>
                    <td>${target.toFixed(2)}</td>
                    <td style="color:var(--success); font-weight:bold;">${terkumpul.toFixed(2)}</td>
                    <td>${statusSisa}</td>
                </tr>
            `;
        });
    }

    async function updateSampai() {
        const no = document.getElementById('inputNo').value;
        const tgl = document.getElementById('inputTglSampai').value;
        
        if(!no || !tgl) { alert("Harap isi No Pengiriman dan Tanggal Sampai!"); return; }
        
        document.getElementById('updateStatus').innerText = 'Menyimpan ke server... ⏳';
        
        // POST Request tanpa membuka Google Sheets
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'update_sampai', no: no, tanggal_sampai: tgl }),
            headers: { "Content-Type": "text/plain;charset=utf-8" }
        });

        document.getElementById('updateStatus').innerText = 'Berhasil diupdate! Memuat ulang tabel...';
        document.getElementById('inputNo').value = '';
        document.getElementById('inputTglSampai').value = '';
        
        // Refresh tabel secara otomatis setelah update
        loadData(); 
    }

    // Panggil saat web pertama kali dibuka
    window.onload = loadData;
</script>
</body>
</html>
