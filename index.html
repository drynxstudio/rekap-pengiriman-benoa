<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaterialTrack - Modern Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f1f5f9; --card-bg: rgba(255, 255, 255, 0.98);
            --primary: #2563eb; --primary-hover: #1d4ed8;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --purple: #8b5cf6;
            --text-main: #0f172a; --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg-color);
            margin: 0; padding: 20px; color: var(--text-main);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        /* Navbar & Button */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .navbar .logo { font-size: 22px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-add:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(37,99,235,0.3); }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); padding: 18px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; align-items: flex-start; gap: 15px; }
        .stat-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 20px; flex-shrink: 0;}
        .bg-blue { background: #eff6ff; color: var(--primary); }
        .bg-green { background: #ecfdf5; color: var(--success); }
        .bg-yellow { background: #fffbeb; color: var(--warning); }
        .bg-purple { background: #faf5ff; color: var(--purple); }
        
        .stat-info h3 { margin: 0; font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom:8px;}
        .stat-list { font-size: 16px; font-weight: 800; color: var(--text-main); display: flex; flex-direction: column; gap: 4px;}
        .unit-badge { font-size:11px; background:#e2e8f0; padding:2px 6px; border-radius:4px; color:#475569; margin-left:4px;}

        /* ========================================================
           MODERN TRACKING MAP (DARK MODE HUD)
           ======================================================== */
        .map-section {
            background: #0f172a; /* Dark sleek background */
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }
        .map-header {
            font-weight: 700; margin-bottom: 20px; color: #f8fafc; 
            display: flex; align-items: center; gap: 10px; font-size: 16px;
        }
        .map-container {
            position: relative; height: 120px; 
            background: #1e293b; border-radius: 16px; 
            border: 1px solid #334155;
            display: flex; align-items: center;
        }
        
        /* Titik Pangkal & Ujung (Glowing Nodes) */
        .map-node {
            position: absolute; width: 70px; height: 70px; border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 5; font-size: 11px; font-weight: 700; color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .node-supplier {
            left: 30px; background: linear-gradient(135deg, #3b82f6, #1e3a8a);
            border: 2px solid #60a5fa; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .node-site {
            right: 30px; background: linear-gradient(135deg, #10b981, #064e3b);
            border: 2px solid #34d399; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        /* Jalur Neon (Glowing Route) */
        .map-route {
            position: absolute; left: 100px; right: 100px; height: 3px;
            background: rgba(255,255,255,0.05);
        }
        .map-route-dash {
            width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg, #3b82f6 0, #3b82f6 10px, transparent 10px, transparent 20px);
            animation: moveRoute 1s linear infinite;
        }
        @keyframes moveRoute {
            from { background-position: 0 0; }
            to { background-position: -20px 0; } /* Animasi arus data */
        }

        /* Truk Modern dengan Label HUD */
        .modern-truck {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; gap: 8px; z-index: 10;
        }
        .truck-icon {
            background: #1e293b; color: #60a5fa; padding: 8px; border-radius: 50%;
            border: 2px solid #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.5);
        }
        .truck-label {
            background: rgba(15, 23, 42, 0.85); color: #f8fafc;
            padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600;
            border: 1px solid #334155; backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .truck-otw { animation: modernDrive 8s linear infinite; }
        
        @keyframes modernDrive {
            0% { left: 2%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 90%; opacity: 0; }
        }

        /* Layout Bawah */
        .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        .panel { background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .tracking-panel { max-height: 60vh; overflow-y: auto; }
        
        /* Tracking Items */
        .tracking-item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 15px; background:#fff;}
        .truck-header { display: flex; justify-content: space-between; border-bottom: 1px dashed #cbd5e1; padding-bottom: 12px; margin-bottom: 12px;}
        
        /* Modal & Form */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-overlay.active { display: flex; animation: fadeIn 0.2s; }
        .modal-content { background: white; width: 100%; max-width: 500px; padding: 30px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;}
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px;}
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #94a3b8; }
        
        label { font-size: 13px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; background:#f8fafc; box-sizing: border-box;}
        .form-row { display: flex; gap: 15px; }
        button.action-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition:0.3s; margin-bottom:10px;}
        .btn-green { background: var(--success); color: white; }
        .btn-whatsapp { background: #25D366; color: white; margin-top:20px; }

        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
        
        .tabs { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; padding: 10px 15px; font-weight: 600; color: #64748b; cursor: pointer; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .navbar { flex-direction: column; gap:15px;}
            .map-route { left: 70px; right: 70px; }
            .map-node { width: 60px; height: 60px; font-size: 10px; }
            .node-supplier { left: 10px; }
            .node-site { right: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <div class="logo"><i class="fa-solid fa-truck-fast"></i> MaterialTrack Pro</div>
        <button class="btn-add" onclick="openModal()"><i class="fa-solid fa-plus"></i> Input Pengiriman Baru</button>
    </div>

    <!-- 4 Stats Grid -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon bg-blue"><i class="fa-solid fa-bullseye"></i></div>
            <div class="stat-info">
                <h3>Total Dipesan (Material Base)</h3>
                <div class="stat-list" id="statTarget">Memuat...</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-green"><i class="fa-solid fa-box-check"></i></div>
            <div class="stat-info">
                <h3>Total Diterima (Onsite)</h3>
                <div class="stat-list" id="statSampai">Memuat...</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-yellow"><i class="fa-solid fa-truck-moving"></i></div>
            <div class="stat-info">
                <h3>Sedang Dikirim (OTW)</h3>
                <div class="stat-list" id="statOtw">Memuat...</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-purple"><i class="fa-solid fa-boxes-stacked"></i></div>
            <div class="stat-info">
                <h3>Sisa Belum Dikirim (Pabrik)</h3>
                <div class="stat-list" id="statSisa">Memuat...</div>
            </div>
        </div>
    </div>

    <!-- MODERN TOP-DOWN MAP -->
    <div class="map-section">
        <div class="map-header">
            <i class="fa-solid fa-satellite-dish fa-beat" style="color: #34d399;"></i> 
            Live Logistic Network
        </div>
        <div class="map-container">
            <div class="map-node node-supplier">
                <i class="fa-solid fa-industry fa-lg" style="margin-bottom: 4px;"></i> Supplier
            </div>
            
            <div class="map-route">
                <div class="map-route-dash"></div>
            </div>
            
            <!-- Tempat Truk Animasi -->
            <div id="modernMapTrucks"></div>
            
            <div class="map-node node-site">
                <i class="fa-solid fa-person-digging fa-lg" style="margin-bottom: 4px;"></i> Onsite
            </div>
        </div>
    </div>

    <!-- Tracking List & Actions -->
    <div class="main-grid">
        <div class="panel tracking-panel" id="trackingList">
            <div style="text-align:center; padding:40px; color:var(--primary);"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Sinkronisasi Database...</div>
        </div>

        <div class="panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('tab-sampai', this)">Konfirmasi Sampai</button>
                <button class="tab-btn" onclick="switchTab('tab-edit', this)">Edit Resi</button>
            </div>

            <div id="tab-sampai" class="tab-content active">
                <label>Pilih Truk (Resi)</label>
                <select id="selResiSampai"></select>
                <label>Tanggal Sampai Onsite</label>
                <input type="date" id="inTglSampai">
                <button class="action-btn btn-green" onclick="updateSampai()" id="btnSampai">
                    <i class="fa-solid fa-check"></i> Tandai Barang Sampai
                </button>
            </div>

            <div id="tab-edit" class="tab-content">
                <label>Pilih Resi Yang Salah</label>
                <select id="selResiEdit" onchange="loadEditForm()"></select>
                <div style="background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom: 10px;">
                    <label>No Resi</label><input type="text" id="edNo">
                    <div class="form-row">
                        <div style="flex:2"><label>Jumlah</label><input type="number" id="edJml" step="0.01"></div>
                        <div style="flex:1"><label>Satuan</label><input type="text" id="edSat"></div>
                    </div>
                    <label>Plat</label><input type="text" id="edPlat">
                </div>
                <button class="action-btn" style="background:var(--warning); color:white;" onclick="simpanEdit()" id="btnEdit">
                    <i class="fa-solid fa-pen"></i> Simpan Perubahan
                </button>
            </div>

            <button class="action-btn btn-whatsapp" onclick="shareWhatsApp()">
                <i class="fa-brands fa-whatsapp fa-lg"></i> Share Laporan WhatsApp
            </button>
        </div>
    </div>
</div>

<!-- MODAL INPUT PENGIRIMAN BARU -->
<div class="modal-overlay" id="addModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0;"><i class="fa-solid fa-truck-ramp-box"></i> Input Pengiriman Baru</h3>
            <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="form-row">
            <div style="flex:1;"><label>No Resi / DO</label><input type="text" id="addNo" placeholder="Contoh: DO-01"></div>
            <div style="flex:1;"><label>Tanggal Berangkat</label><input type="date" id="addTgl"></div>
        </div>
        
        <label>Item Material</label>
        <input type="text" id="addItem" placeholder="Contoh: PAVING DC10N 21x10">
        <label>Mutu</label>
        <input type="text" id="addMutu" placeholder="Contoh: K500">
        
        <div class="form-row">
            <div style="flex:2;"><label>Jumlah</label><input type="number" id="addJumlah" step="0.01" placeholder="0"></div>
            <div style="flex:1;"><label>Satuan</label><input type="text" id="addSatuan" placeholder="m2 / pcs"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Nama Pengemudi</label><input type="text" id="addSopir"></div>
            <div style="flex:1;"><label>Plat Kendaraan</label><input type="text" id="addPlat"></div>
        </div>

        <button class="action-btn btn-green" onclick="submitPengirimanBaru()" id="btnAddSubmit" style="margin-top:10px;">
            <i class="fa-solid fa-paper-plane"></i> Kirim Data & Simpan
        </button>
    </div>
</div>

<script>
    // MASUKKAN URL APPS SCRIPT ANDA DI BAWAH INI
    const API_URL = 'https://script.google.com/macros/s/AKfycbx1sqFB04reLD2XM9CFJUITXSyP50hizXX4TsYfflOx9Q6SuEp0mFzuF7YfuskXWa97/exec'; 

    let dataPengiriman = [];
    let dataPesanan = [];
    let globalStats = {}; 

    async function init() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            dataPengiriman = data.pengiriman;
            dataPesanan = data.pesanan;
            
            calculateStats();
            renderModernMap();
            renderTrackingUI();
            populateDropdowns();
        } catch (e) {
            document.getElementById('trackingList').innerHTML = `<div style="color:red; text-align:center;">Gagal Terhubung. Cek URL API.</div>`;
        }
    }

    // LOGIKA KALKULASI YANG DIPERBAIKI (Absolute Base Target)
    function calculateStats() {
        globalStats = {};
        
        // 1. TOTAL TARGET murni hanya mengambil dari sheet Master Pesanan (Material Base)
        dataPesanan.forEach(p => {
            let unit = (p['SATUAN'] || 'm2').toLowerCase().trim();
            if(!globalStats[unit]) {
                globalStats[unit] = { target: 0, sampai: 0, otw: 0, sisa: 0 };
            }
            globalStats[unit].target += parseFloat(p['TOTAL PESANAN']) || 0;
        });

        // 2. Kalkulasi barang yang sudah masuk / sedang dijalan
        dataPengiriman.forEach(row => {
            if(!row['NO']) return;
            let unit = (row['SATUAN'] || 'm2').toLowerCase().trim();
            
            // Jaga-jaga jika ada satuan di pengiriman yang tidak ditulis di Master Pesanan
            if(!globalStats[unit]) {
                globalStats[unit] = { target: 0, sampai: 0, otw: 0, sisa: 0 };
            }
            
            let jumlah = parseFloat(row['JUMLAH']) || 0;
            if(row['TANGGAL SAMPAI'] !== "") {
                globalStats[unit].sampai += jumlah;
            } else {
                globalStats[unit].otw += jumlah;
            }
        });

        // 3. Kalkulasi Sisa Pabrik (Target - Diterima - OTW)
        let hTarget = '', hSampai = '', hOtw = '', hSisa = '';
        for(let unit in globalStats) {
            let s = globalStats[unit];
            s.sisa = s.target - (s.sampai + s.otw);
            if(s.sisa < 0) s.sisa = 0; // Cegah minus

            let badg = `<span class="unit-badge">${unit}</span>`;
            hTarget += `<div>${s.target.toLocaleString('id-ID')} ${badg}</div>`;
            hSampai += `<div>${s.sampai.toLocaleString('id-ID')} ${badg}</div>`;
            hOtw += `<div>${s.otw.toLocaleString('id-ID')} ${badg}</div>`;
            hSisa += `<div>${s.sisa.toLocaleString('id-ID')} ${badg}</div>`;
        }
        
        document.getElementById('statTarget').innerHTML = hTarget || '0';
        document.getElementById('statSampai').innerHTML = hSampai || '0';
        document.getElementById('statOtw').innerHTML = hOtw || '0';
        document.getElementById('statSisa').innerHTML = hSisa || '0';
    }

    // Render Modern Dark Map Animasi
    function renderModernMap() {
        const truckContainer = document.getElementById('modernMapTrucks');
        truckContainer.innerHTML = ''; 
        
        let otwCount = 0;
        
        dataPengiriman.forEach((row) => {
            if(!row['NO']) return;
            
            if(row['TANGGAL SAMPAI'] === "") {
                // Berikan jeda animasi beda-beda agar truk tidak tumpah tindih
                const delay = (otwCount * 2.5); 
                truckContainer.innerHTML += `
                    <div class="modern-truck truck-otw" style="animation-delay: -${delay}s;">
                        <div class="truck-icon"><i class="fa-solid fa-truck-moving"></i></div>
                        <div class="truck-label">${row['PLAT KENDARAAN']} <span style="color:#60a5fa;">(${row['JUMLAH']}${row['SATUAN']})</span></div>
                    </div>
                `;
                otwCount++;
            }
        });
    }

    // Render List Tabel Kiri
    function renderTrackingUI() {
        const container = document.getElementById('trackingList');
        container.innerHTML = ''; 
        const sortedData = [...dataPengiriman].reverse();
        
        sortedData.forEach(row => {
            if(!row['NO']) return;
            const isArrived = row['TANGGAL SAMPAI'] !== "";
            const tBerangkat = row['TANGGAL BERANGKAT'] ? new Date(row['TANGGAL BERANGKAT']).toLocaleDateString('id-ID') : '-';
            const tSampai = isArrived ? new Date(row['TANGGAL SAMPAI']).toLocaleDateString('id-ID') : '-';

            container.innerHTML += `
                <div class="tracking-item">
                    <div class="truck-header">
                        <strong style="color:var(--primary); font-size:15px;">#${row['NO']} - ${row['ITEM']}</strong>
                        ${isArrived ? '<span style="background:#ecfdf5; color:var(--success); padding:4px 10px; border-radius:8px; font-size:12px; font-weight:bold;">Terkirim</span>' : '<span style="background:#fffbeb; color:var(--warning); padding:4px 10px; border-radius:8px; font-size:12px; font-weight:bold;">OTW</span>'}
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted);">
                        <div><i class="fa-solid fa-user-tie"></i> ${row['NAMA PENGEMUDI']}</div>
                        <div><i class="fa-solid fa-car"></i> <b>${row['PLAT KENDARAAN']}</b></div>
                        <div><i class="fa-solid fa-cube"></i> <b>${row['JUMLAH']} ${row['SATUAN']}</b></div>
                    </div>
                </div>
            `;
        });
    }

    // Load Dropdown Form
    function populateDropdowns() {
        const selS = document.getElementById('selResiSampai');
        const selE = document.getElementById('selResiEdit');
        selS.innerHTML = '<option value="">-- Pilih Truk (Status OTW) --</option>';
        selE.innerHTML = '<option value="">-- Pilih Resi Untuk Edit --</option>';
        
        dataPengiriman.forEach(row => {
            if(!row['NO']) return;
            let text = `${row['NO']} - ${row['PLAT KENDARAAN']} (${row['JUMLAH']} ${row['SATUAN']})`;
            if(row['TANGGAL SAMPAI'] === "") selS.innerHTML += `<option value="${row['NO']}">${text}</option>`;
            selE.innerHTML += `<option value="${row['NO']}">${text}</option>`;
        });
    }

    // Modal Control & UI Switcher
    function openModal() { document.getElementById('addModal').classList.add('active'); }
    function closeModal() { document.getElementById('addModal').classList.remove('active'); }
    function switchTab(t, el) {
        document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
        document.getElementById(t).classList.add('active');
        el.classList.add('active');
    }

    function loadEditForm() {
        let r = dataPengiriman.find(x => x['NO'] == document.getElementById('selResiEdit').value);
        if(r) {
            document.getElementById('edNo').value = r['NO'];
            document.getElementById('edJml').value = r['JUMLAH'];
            document.getElementById('edSat').value = r['SATUAN'];
            document.getElementById('edPlat').value = r['PLAT KENDARAAN'];
        }
    }

    // Core API Logic
    async function reqApi(payload, btnId, lText, oText) {
        let btn = document.getElementById(btnId);
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${lText}...`; btn.disabled = true;
        try {
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), headers: { "Content-Type": "text/plain;charset=utf-8" } });
            alert("Berhasil!"); await init(); 
        } catch(e) { alert("Error Server!"); }
        btn.innerHTML = oText; btn.disabled = false;
    }

    function updateSampai() {
        let no = document.getElementById('selResiSampai').value, tgl = document.getElementById('inTglSampai').value;
        if(!no || !tgl) return alert("Pilih Resi dan Tanggal!");
        reqApi({action:'update_sampai', no:no, tanggal_sampai:tgl}, 'btnSampai', 'Loading', '<i class="fa-solid fa-check"></i> Tandai Barang Sampai');
    }

    function simpanEdit() {
        let lama = document.getElementById('selResiEdit').value;
        if(!lama) return alert("Pilih resi!");
        reqApi({
            action: 'edit_resi', no_lama: lama, 
            no_baru: document.getElementById('edNo').value,
            jumlah: document.getElementById('edJml').value,
            satuan: document.getElementById('edSat').value,
            plat: document.getElementById('edPlat').value
        }, 'btnEdit', 'Menyimpan', '<i class="fa-solid fa-pen"></i> Simpan Perubahan');
    }

    function submitPengirimanBaru() {
        let no = document.getElementById('addNo').value;
        if(!no) return alert("No Resi Wajib Diisi!");
        let payload = {
            action: 'tambah_resi', no: no, tgl_berangkat: document.getElementById('addTgl').value,
            item: document.getElementById('addItem').value, mutu: document.getElementById('addMutu').value,
            jumlah: document.getElementById('addJumlah').value, satuan: document.getElementById('addSatuan').value,
            pengemudi: document.getElementById('addSopir').value, plat: document.getElementById('addPlat').value
        };
        reqApi(payload, 'btnAddSubmit', 'Menyimpan', '<i class="fa-solid fa-paper-plane"></i> Kirim Data & Simpan').then(() => {
            closeModal(); document.querySelectorAll('#addModal input').forEach(inp => inp.value = '');
        });
    }

    function shareWhatsApp() {
        let text = `*🚧 REPORT LOGISTIK ONSITE*\nTanggal: ${new Date().toLocaleDateString('id-ID')}\n\n`;
        text += `*📊 STATUS PESANAN:*\n`;
        for(let u in globalStats) {
            let s = globalStats[u];
            text += `*Satuan: ${u.toUpperCase()}*\n`;
            text += ` 🎯 Total Dipesan : ${s.target.toLocaleString('id-ID')} ${u}\n`;
            text += ` ✅ Diterima Site : ${s.sampai.toLocaleString('id-ID')} ${u}\n`;
            text += ` 🚚 OTW Jalan     : ${s.otw.toLocaleString('id-ID')} ${u}\n`;
            text += ` ⏳ Sisa di Pabrik: ${s.sisa.toLocaleString('id-ID')} ${u}\n\n`;
        }
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    window.onload = init;
</script>
</body>
</html>
