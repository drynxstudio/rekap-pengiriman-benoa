<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaterialTrack Pro</title>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.98);
            --primary: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 20px; color: var(--text-main);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .navbar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .navbar .logo { font-size: 22px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 10px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; align-items: flex-start; gap: 15px; }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 24px; flex-shrink: 0;}
        .bg-blue { background: #eff6ff; color: var(--primary); }
        .bg-green { background: #ecfdf5; color: var(--success); }
        .bg-yellow { background: #fffbeb; color: var(--warning); }
        
        .stat-info h3 { margin: 0; font-size: 14px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom:8px;}
        .stat-list { font-size: 18px; font-weight: 700; color: var(--text-main); display: flex; flex-direction: column; gap: 5px;}
        .unit-badge { font-size:12px; background:#e2e8f0; padding:2px 6px; border-radius:6px; color:#475569; margin-left:5px;}

        .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        
        .panel { background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .tracking-panel { max-height: 70vh; overflow-y: auto; }
        
        .tracking-item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 15px; transition: 0.3s; background:#fff;}
        .tracking-item:hover { transform: translateY(-3px); box-shadow: 0 10px 20px -5px rgba(0,0,0,0.08); border-color:#cbd5e1;}
        .truck-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #cbd5e1; padding-bottom: 12px; margin-bottom: 12px;}
        
        /* Modern UI Progress Bar */
        .progress-container { display: flex; justify-content: space-between; position: relative; margin-top: 15px; padding: 0 10px;}
        .progress-line { position: absolute; top: 15px; left: 30px; right: 30px; height: 4px; background: #e2e8f0; z-index: 1; border-radius:4px;}
        .progress-line-fill { position: absolute; top: 15px; left: 30px; height: 4px; background: var(--primary); z-index: 2; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); border-radius:4px; width:0;}
        
        .step { position: relative; z-index: 3; text-align: center; width: 80px;}
        .step-icon { width: 34px; height: 34px; border-radius: 50%; background: #e2e8f0; color: #94a3b8; display: flex; justify-content: center; align-items: center; margin: 0 auto 8px; font-size: 14px; transition: 0.5s; border: 3px solid #fff;}
        .step.done .step-icon { background: var(--success); color: white; }
        .step.active .step-icon { background: var(--primary); color: white; animation: pulse-glow 2s infinite; }
        .step-text { font-size: 12px; color: var(--text-muted); font-weight: 600;}

        /* Animasi */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(37,99,235, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(37,99,235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37,99,235, 0); }
        }
        .css-truck { display: inline-block; animation: bounce-truck 1s infinite alternate; }
        @keyframes bounce-truck { from {transform: translateY(0);} to {transform: translateY(-4px);} }

        /* Forms */
        .tabs { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; padding: 10px 20px; font-weight: 600; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        
        @keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }

        label { font-size: 13px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; background:#f8fafc;}
        input:focus, select:focus { outline:none; border-color:var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition:0.3s;}
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #d97706; }
        .btn-whatsapp { background: #25D366; color: white; margin-top: 20px; }
        .btn-whatsapp:hover { background: #1da851; }

        /* RESPONSIVE SMARTPHONE MODE */
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .navbar { flex-direction: column; gap:10px; padding:15px; }
            .stats-grid { grid-template-columns: 1fr; }
            
            /* Ubah tracking bar jadi vertikal di HP */
            .progress-container { flex-direction: column; align-items: flex-start; gap: 20px; padding-left: 15px;}
            .progress-line { width: 4px; height: calc(100% - 30px); top: 15px; left: 30px; }
            .progress-line-fill { width: 4px; height: 0; top: 15px; left: 30px; transition: height 1s; }
            .step { display: flex; align-items: center; gap: 15px; width: 100%; text-align: left; }
            .step-icon { margin: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Navbar -->
    <div class="navbar">
        <div class="logo"><i class="fa-solid fa-cube"></i> MaterialTrack Pro</div>
        <div style="font-size:14px; font-weight:600;"><i class="fa-solid fa-satellite-dish" style="color:var(--success); animation: pulse-glow 2s infinite; border-radius:50%;"></i> Sinkronisasi Aktif</div>
    </div>

    <!-- Stats Panel -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon bg-blue"><i class="fa-solid fa-bullseye"></i></div>
            <div class="stat-info">
                <h3>Total Target Pesanan</h3>
                <div class="stat-list" id="statTarget">Loading...</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-green"><i class="fa-solid fa-check-double"></i></div>
            <div class="stat-info">
                <h3>Sudah Diterima</h3>
                <div class="stat-list" id="statTerkumpul">Loading...</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-yellow"><i class="fa-solid fa-boxes-open"></i></div>
            <div class="stat-info">
                <h3>Sisa Kekurangan</h3>
                <div class="stat-list" id="statSisa">Loading...</div>
            </div>
        </div>
    </div>

    <div class="main-grid">
        <!-- Live Tracking Panel -->
        <div class="panel tracking-panel" id="trackingList">
            <div style="text-align:center; padding:40px; color:var(--primary);"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Memuat Data Pengiriman...</div>
        </div>

        <!-- Action Panel -->
        <div class="panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('tab-sampai', this)">Konfirmasi Sampai</button>
                <button class="tab-btn" onclick="switchTab('tab-edit', this)">Edit Resi</button>
            </div>

            <!-- Tab: Update Sampai -->
            <div id="tab-sampai" class="tab-content active">
                <label>Pilih Pengiriman (Resi)</label>
                <select id="selResiSampai">
                    <option value="">-- Pilih Truk Menuju Site --</option>
                </select>
                
                <label>Tanggal Sampai</label>
                <input type="date" id="inTglSampai">
                
                <button class="btn-primary" onclick="updateSampai()" id="btnSampai">
                    <i class="fa-solid fa-location-dot"></i> Tandai Barang Sampai
                </button>
            </div>

            <!-- Tab: Edit Data Resi -->
            <div id="tab-edit" class="tab-content">
                <label>Pilih Resi Yang Akan Diedit</label>
                <select id="selResiEdit" onchange="loadEditForm()">
                    <option value="">-- Pilih Resi --</option>
                </select>

                <div style="background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0;">
                    <label>No Resi / Pengiriman Baru</label>
                    <input type="text" id="editNo" placeholder="Misal: 1 atau RESI-01">
                    
                    <div style="display:flex; gap:10px;">
                        <div style="flex:2;">
                            <label>Jumlah</label>
                            <input type="number" id="editJumlah" step="0.01">
                        </div>
                        <div style="flex:1;">
                            <label>Satuan</label>
                            <input type="text" id="editSatuan" placeholder="m2 / pcs">
                        </div>
                    </div>

                    <label>Plat Kendaraan</label>
                    <input type="text" id="editPlat" placeholder="Misal: B 1234 CD">
                    
                    <button class="btn-warning" onclick="simpanEdit()" id="btnEdit">
                        <i class="fa-solid fa-pen-to-square"></i> Simpan Perubahan
                    </button>
                </div>
            </div>

            <button class="btn-whatsapp" onclick="shareWhatsApp()">
                <i class="fa-brands fa-whatsapp fa-lg"></i> Share Laporan ke WhatsApp
            </button>
        </div>
    </div>
</div>

<script>
    // MASUKKAN URL APPS SCRIPT ANDA DI SINI
    const API_URL = 'https://script.google.com/macros/s/AKfycbx1sqFB04reLD2XM9CFJUITXSyP50hizXX4TsYfflOx9Q6SuEp0mFzuF7YfuskXWa97/exec'; 

    let dataPengiriman = [];
    let dataPesanan = [];
    let globalStats = {}; // Akan memisahkan m2, pcs, dll

    async function init() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            dataPengiriman = data.pengiriman;
            dataPesanan = data.pesanan;
            
            calculateUnits();
            renderTrackingUI();
            populateDropdowns();
        } catch (e) {
            document.getElementById('trackingList').innerHTML = `<div style="color:red; text-align:center;">Gagal Terhubung ke Database.</div>`;
        }
    }

    // Pemisahan Satuan Otomatis (m2, pcs, dll)
    function calculateUnits() {
        globalStats = {};
        
        // Target dari Master Pesanan
        dataPesanan.forEach(p => {
            let unit = (p['SATUAN'] || 'm2').toLowerCase().trim();
            if(!globalStats[unit]) globalStats[unit] = { target: 0, terkumpul: 0, sisa: 0 };
            globalStats[unit].target += parseFloat(p['TOTAL PESANAN']) || 0;
        });

        // Hitung yang sudah sampai
        dataPengiriman.forEach(row => {
            if(row['TANGGAL SAMPAI'] !== "") {
                let unit = (row['SATUAN'] || 'm2').toLowerCase().trim();
                if(!globalStats[unit]) globalStats[unit] = { target: 0, terkumpul: 0, sisa: 0 };
                globalStats[unit].terkumpul += parseFloat(row['JUMLAH']) || 0;
            }
        });

        // Render ke UI
        let htmlTarget = '', htmlTerkumpul = '', htmlSisa = '';
        for(let unit in globalStats) {
            let target = globalStats[unit].target;
            let kumpul = globalStats[unit].terkumpul;
            let sisa = target - kumpul;
            if(sisa < 0) sisa = 0;
            globalStats[unit].sisa = sisa; // Simpan untuk WA

            htmlTarget += `<div>${target.toLocaleString('id-ID')} <span class="unit-badge">${unit}</span></div>`;
            htmlTerkumpul += `<div>${kumpul.toLocaleString('id-ID')} <span class="unit-badge">${unit}</span></div>`;
            htmlSisa += `<div>${sisa.toLocaleString('id-ID')} <span class="unit-badge">${unit}</span></div>`;
        }
        
        document.getElementById('statTarget').innerHTML = htmlTarget || '0';
        document.getElementById('statTerkumpul').innerHTML = htmlTerkumpul || '0';
        document.getElementById('statSisa').innerHTML = htmlSisa || '0';
    }

    function renderTrackingUI() {
        const container = document.getElementById('trackingList');
        container.innerHTML = ''; 
        const isMobile = window.innerWidth <= 900;

        const sortedData = [...dataPengiriman].reverse();
        sortedData.forEach(row => {
            if(!row['NO']) return;
            
            const isArrived = row['TANGGAL SAMPAI'] !== "";
            const tglBerangkat = row['TANGGAL BERANGKAT'] ? new Date(row['TANGGAL BERANGKAT']).toLocaleDateString('id-ID') : '-';
            const tglSampai = isArrived ? new Date(row['TANGGAL SAMPAI']).toLocaleDateString('id-ID') : '-';
            
            // Animasi fill (Horizontal untuk Desktop, Vertical untuk Mobile)
            const fillStyle = isMobile 
                ? (isArrived ? 'height: 100%;' : 'height: 50%;')
                : (isArrived ? 'width: 100%;' : 'width: 50%;');
                
            const step2Class = 'done';
            const step3Class = isArrived ? 'done' : 'active';
            const truckIcon = isArrived ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-truck css-truck"></i>';
            const statusBadge = isArrived 
                ? `<span style="background:#ecfdf5; color:var(--success); padding:4px 10px; border-radius:12px; font-size:12px; font-weight:bold;">Terkirim</span>`
                : `<span style="background:#fffbeb; color:var(--warning); padding:4px 10px; border-radius:12px; font-size:12px; font-weight:bold;">Di Perjalanan</span>`;

            container.innerHTML += `
                <div class="tracking-item">
                    <div class="truck-header">
                        <strong style="color:var(--primary); font-size:15px;"><i class="fa-solid fa-hashtag"></i> Resi: ${row['NO']} | ${row['ITEM']}</strong>
                        ${statusBadge}
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-bottom:5px;">
                        <div><i class="fa-solid fa-user-tie"></i> ${row['NAMA PENGEMUDI']}</div>
                        <div><i class="fa-solid fa-car-side"></i> <b>${row['PLAT KENDARAAN']}</b></div>
                        <div><i class="fa-solid fa-cubes"></i> <b>${row['JUMLAH']} ${row['SATUAN']}</b></div>
                    </div>
                    
                    <div class="progress-container">
                        <div class="progress-line"></div>
                        <div class="progress-line-fill" style="${fillStyle}"></div>
                        
                        <div class="step done">
                            <div class="step-icon"><i class="fa-solid fa-box-open"></i></div>
                            <div class="step-text">Dimuat</div>
                        </div>
                        <div class="step ${step2Class}">
                            <div class="step-icon"><i class="fa-solid fa-road"></i></div>
                            <div class="step-text">${tglBerangkat}</div>
                        </div>
                        <div class="step ${step3Class}">
                            <div class="step-icon">${truckIcon}</div>
                            <div class="step-text">${isArrived ? tglSampai : 'Onsite'}</div>
                        </div>
                    </div>
                </div>
            `;
        });
        
        // Trigger reflow untuk animasi progress bar
        setTimeout(() => {
            document.querySelectorAll('.progress-line-fill').forEach(el => {
                if(el.style.width === '0px' || el.style.height === '0px'){
                    // animasi CSS akan handle via transition
                }
            });
        }, 100);
    }

    function populateDropdowns() {
        const selSampai = document.getElementById('selResiSampai');
        const selEdit = document.getElementById('selResiEdit');
        
        selSampai.innerHTML = '<option value="">-- Pilih Truk Menuju Site --</option>';
        selEdit.innerHTML = '<option value="">-- Pilih Resi Untuk Diedit --</option>';
        
        dataPengiriman.forEach(row => {
            if(!row['NO']) return;
            const label = `Resi #${row['NO']} - Plat ${row['PLAT KENDARAAN']}`;
            
            // Dropdown Sampai: Hanya yang belum sampai
            if(row['TANGGAL SAMPAI'] === "") {
                selSampai.innerHTML += `<option value="${row['NO']}">${label}</option>`;
            }
            // Dropdown Edit: Semua resi bisa diedit
            selEdit.innerHTML += `<option value="${row['NO']}">${label}</option>`;
        });
    }

    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        el.classList.add('active');
    }

    function loadEditForm() {
        const no = document.getElementById('selResiEdit').value;
        const row = dataPengiriman.find(r => r['NO'] == no);
        if(row) {
            document.getElementById('editNo').value = row['NO'];
            document.getElementById('editJumlah').value = row['JUMLAH'];
            document.getElementById('editSatuan').value = row['SATUAN'];
            document.getElementById('editPlat').value = row['PLAT KENDARAAN'];
        }
    }

    async function sendData(payload, btnId, loadingText, defaultText) {
        const btn = document.getElementById(btnId);
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${loadingText}...`;
        btn.disabled = true;
        
        try {
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            });
            alert("Berhasil disimpan!");
            await init(); // Reload otomatis
        } catch(e) {
            alert("Terjadi kesalahan jaringan.");
        }
        
        btn.innerHTML = defaultText;
        btn.disabled = false;
    }

    function updateSampai() {
        const no = document.getElementById('selResiSampai').value;
        const tgl = document.getElementById('inTglSampai').value;
        if(!no || !tgl) return alert("Pilih Resi dan Tanggal!");
        
        sendData({ action: 'update_sampai', no: no, tanggal_sampai: tgl }, 
                 'btnSampai', 'Mengupdate', '<i class="fa-solid fa-location-dot"></i> Tandai Barang Sampai');
    }

    function simpanEdit() {
        const noLama = document.getElementById('selResiEdit').value;
        if(!noLama) return alert("Pilih resi yang mau diedit!");
        
        const payload = {
            action: 'edit_resi',
            no_lama: noLama,
            no_baru: document.getElementById('editNo').value,
            jumlah: document.getElementById('editJumlah').value,
            satuan: document.getElementById('editSatuan').value,
            plat: document.getElementById('editPlat').value
        };
        sendData(payload, 'btnEdit', 'Menyimpan', '<i class="fa-solid fa-pen-to-square"></i> Simpan Perubahan');
    }

    function shareWhatsApp() {
        let text = `*📊 LAPORAN MATERIAL ONSITE*\nTanggal: ${new Date().toLocaleDateString('id-ID')}\n\n`;
        text += `*REKAPITULASI TARGET & SISA:*\n`;
        
        for(let unit in globalStats) {
            text += `🔹 *Satuan: ${unit.toUpperCase()}*\n`;
            text += `   - Target: ${globalStats[unit].target.toLocaleString('id-ID')} ${unit}\n`;
            text += `   - Sampai: ${globalStats[unit].terkumpul.toLocaleString('id-ID')} ${unit}\n`;
            text += `   - Sisa  : ${globalStats[unit].sisa.toLocaleString('id-ID')} ${unit}\n\n`;
        }

        text += `🚚 *SEDANG DI PERJALANAN (OTW):*\n`;
        let countOtw = 0;
        dataPengiriman.forEach(row => {
            if(row['NO'] && row['TANGGAL SAMPAI'] === "") {
                text += `- Resi #${row['NO']} | ${row['PLAT KENDARAAN']} (${row['JUMLAH']} ${row['SATUAN']})\n`;
                countOtw++;
            }
        });
        if(countOtw === 0) text += `- _Semua barang sudah sampai onsite._\n`;

        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    // Refresh layout jika ukuran browser diganti (Desktop <-> HP)
    window.addEventListener('resize', renderTrackingUI);
    window.onload = init;
</script>
</body>
</html>
