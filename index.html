<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaterialTrack Dashboard</title>
    <!-- Font Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #eef2f9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }

        /* Top Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }
        .navbar .logo { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 10px; }

        /* Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(10px);
        }
        .stat-icon {
            width: 50px; height: 50px; border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px;
        }
        .bg-blue { background: #eff6ff; color: var(--primary); }
        .bg-green { background: #ecfdf5; color: var(--success); }
        .bg-yellow { background: #fffbeb; color: var(--warning); }
        
        .stat-info h3 { margin: 0; font-size: 24px; color: var(--text-main); }
        .stat-info p { margin: 0; font-size: 13px; color: var(--text-muted); font-weight: 600;}

        /* Main Content Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        /* Tracking Panel (Kiri) */
        .tracking-panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            max-height: 600px;
            overflow-y: auto;
        }
        .tracking-item {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: 0.3s;
        }
        .tracking-item:hover { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); transform: translateY(-2px); }
        
        .truck-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px;}
        .truck-id { font-weight: 700; color: var(--primary); }
        
        /* Progress Bar UI */
        .progress-container { display: flex; justify-content: space-between; position: relative; margin-top: 10px;}
        .progress-line { position: absolute; top: 15px; left: 30px; right: 30px; height: 3px; background: #e2e8f0; z-index: 1;}
        .progress-line-fill { position: absolute; top: 15px; left: 30px; height: 3px; background: var(--primary); z-index: 2; transition: 1s;}
        
        .step { position: relative; z-index: 3; text-align: center; width: 60px;}
        .step-icon { width: 30px; height: 30px; border-radius: 50%; background: #e2e8f0; color: white; display: flex; justify-content: center; align-items: center; margin: 0 auto 5px; font-size: 12px; }
        .step.active .step-icon { background: var(--primary); box-shadow: 0 0 10px rgba(37,99,235,0.4); }
        .step.done .step-icon { background: var(--success); }
        .step-text { font-size: 11px; color: var(--text-muted); font-weight: 600;}

        /* Action Panel (Kanan) - Edit & WhatsApp */
        .action-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .action-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .action-card h3 { margin-top: 0; font-size: 16px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;}
        
        input, select {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #cbd5e1; border-radius: 8px;
            box-sizing: border-box; font-family: 'Inter', sans-serif;
        }
        button {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-weight: 600; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-whatsapp { background: #25D366; color: white; margin-top: 10px;}
        .btn-whatsapp:hover { background: #1da851; }

        /* Animasi Truk CSS */
        .css-truck { display: inline-block; animation: bounce 1s infinite alternate; }
        @keyframes bounce { from {transform: translateY(0);} to {transform: translateY(-3px);} }
        
        .loading-screen { text-align: center; padding: 50px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo"><i class="fa-solid fa-cube"></i> MaterialTrack</div>
        <div style="display:flex; gap:15px; align-items:center;">
            <span style="font-weight:600; font-size:14px;"><i class="fa-solid fa-circle-dot" style="color:var(--success);"></i> Live Data</span>
        </div>
    </div>

    <!-- Top Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon bg-blue"><i class="fa-solid fa-boxes-stacked"></i></div>
            <div class="stat-info">
                <h3 id="statTotalTarget">0</h3>
                <p>Total Pesanan Paving</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-green"><i class="fa-solid fa-check-double"></i></div>
            <div class="stat-info">
                <h3 id="statTerkumpul">0</h3>
                <p>Terkirim & Sampai (m2)</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-yellow"><i class="fa-solid fa-truck-fast"></i></div>
            <div class="stat-info">
                <h3 id="statSisa">0</h3>
                <p>Sisa Kekurangan (m2)</p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-grid">
        <!-- Panel Kiri: Live Tracking UI -->
        <div class="tracking-panel" id="trackingList">
            <div class="loading-screen"><i class="fa-solid fa-spinner fa-spin"></i> Menghubungkan ke server...</div>
        </div>

        <!-- Panel Kanan: Edit & Share -->
        <div class="action-panel">
            <div class="action-card">
                <h3><i class="fa-solid fa-pen-to-square"></i> Update Kedatangan</h3>
                <label style="font-size:12px; font-weight:600; color:var(--text-muted);">Pilih Pengiriman (Resi NO)</label>
                <select id="inputNo">
                    <option value="">-- Pilih No Resi --</option>
                </select>
                
                <label style="font-size:12px; font-weight:600; color:var(--text-muted);">Tanggal Sampai di Onsite</label>
                <input type="date" id="inputTglSampai">
                
                <button class="btn-primary" onclick="updateSampai()" id="btnUpdate">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Konfirmasi Sampai
                </button>
            </div>

            <div class="action-card">
                <h3><i class="fa-brands fa-whatsapp"></i> Bagikan Laporan</h3>
                <p style="font-size: 13px; color: var(--text-muted); margin-top:0;">Kirim rekap total pesanan, barang masuk, dan sisa ke grup WhatsApp proyek.</p>
                <button class="btn-whatsapp" onclick="shareWhatsApp()">
                    <i class="fa-brands fa-whatsapp fa-lg"></i> Share ke WhatsApp
                </button>
            </div>
        </div>
    </div>

<script>
    // MASUKKAN URL WEB APP APPS SCRIPT ANDA DI SINI
    const API_URL = 'https://script.google.com/macros/s/AKfycbx1sqFB04reLD2XM9CFJUITXSyP50hizXX4TsYfflOx9Q6SuEp0mFzuF7YfuskXWa97/exec'; 

    let dataPengiriman = [];
    let dataPesanan = [];
    let rekapData = { target: 0, terkumpul: 0, sisa: 0 };

    async function loadData() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            dataPengiriman = data.pengiriman;
            dataPesanan = data.pesanan;
            
            processStats();
            renderTrackingUI();
            populateSelectBox();
        } catch (error) {
            document.getElementById('trackingList').innerHTML = `<div class="loading-screen" style="color:red;">Gagal memuat data.</div>`;
        }
    }

    function processStats() {
        let totalTarget = 0;
        let totalTerkumpul = 0;

        // Ambil target dari Master Pesanan
        dataPesanan.forEach(p => { totalTarget += (parseFloat(p['TOTAL PESANAN']) || 0); });
        
        // Hitung yang sudah sampai
        dataPengiriman.forEach(row => {
            if(row['TANGGAL SAMPAI'] !== "") {
                totalTerkumpul += (parseFloat(row['JUMLAH']) || 0);
            }
        });

        let sisa = totalTarget - totalTerkumpul;
        if(sisa < 0) sisa = 0;

        // Simpan ke variabel global untuk WA
        rekapData.target = totalTarget;
        rekapData.terkumpul = totalTerkumpul;
        rekapData.sisa = sisa;

        // Update UI
        document.getElementById('statTotalTarget').innerText = totalTarget.toFixed(2);
        document.getElementById('statTerkumpul').innerText = totalTerkumpul.toFixed(2);
        document.getElementById('statSisa').innerText = sisa.toFixed(2);
    }

    function renderTrackingUI() {
        const container = document.getElementById('trackingList');
        container.innerHTML = ''; // Bersihkan loading screen

        // Urutkan dari yang terbaru (diasumsikan NO paling besar = terbaru)
        const sortedData = [...dataPengiriman].reverse();

        sortedData.forEach(row => {
            if(!row['NO']) return; // Skip baris kosong
            
            const isArrived = row['TANGGAL SAMPAI'] !== "";
            const tglBerangkat = row['TANGGAL BERANGKAT'] ? new Date(row['TANGGAL BERANGKAT']).toLocaleDateString('id-ID') : 'Menunggu';
            const tglSampai = isArrived ? new Date(row['TANGGAL SAMPAI']).toLocaleDateString('id-ID') : 'Estimasi...';
            
            // Logika Progress Bar
            const barWidth = isArrived ? '100%' : '50%';
            const step2Class = 'done';
            const step3Class = isArrived ? 'done' : 'active';
            const truckIcon = isArrived ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-truck css-truck"></i>';

            container.innerHTML += `
                <div class="tracking-item">
                    <div class="truck-header">
                        <span class="truck-id"><i class="fa-solid fa-receipt"></i> Resi #${row['NO']} | ${row['ITEM']}</span>
                        <span style="font-size:12px; font-weight:bold; background:${isArrived ? '#ecfdf5':'#fffbeb'}; color:${isArrived ? 'var(--success)':'var(--warning)'}; padding:4px 10px; border-radius:12px;">
                            ${isArrived ? 'Terkirim' : 'In Transit'}
                        </span>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:13px;">
                        <div><i class="fa-solid fa-user"></i> ${row['NAMA PENGEMUDI']}</div>
                        <div><i class="fa-solid fa-car-side"></i> ${row['PLAT KENDARAAN']}</div>
                        <div><i class="fa-solid fa-layer-group"></i> ${row['JUMLAH']} ${row['SATUAN']}</div>
                    </div>
                    
                    <!-- Progress Bar (Mirip gambar referensi) -->
                    <div class="progress-container">
                        <div class="progress-line"></div>
                        <div class="progress-line-fill" style="width: ${barWidth};"></div>
                        
                        <div class="step done">
                            <div class="step-icon"><i class="fa-solid fa-clipboard-check"></i></div>
                            <div class="step-text">Dimuat</div>
                        </div>
                        <div class="step ${step2Class}">
                            <div class="step-icon"><i class="fa-solid fa-road"></i></div>
                            <div class="step-text">${tglBerangkat}</div>
                        </div>
                        <div class="step ${step3Class}">
                            <div class="step-icon">${truckIcon}</div>
                            <div class="step-text">${isArrived ? tglSampai : 'Onsite'}</div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function populateSelectBox() {
        const select = document.getElementById('inputNo');
        select.innerHTML = '<option value="">-- Pilih No Resi --</option>';
        dataPengiriman.forEach(row => {
            // Hanya masukkan ke daftar dropdown jika BELUM sampai
            if(row['NO'] && row['TANGGAL SAMPAI'] === "") {
                select.innerHTML += `<option value="${row['NO']}">Resi #${row['NO']} - Plat ${row['PLAT KENDARAAN']}</option>`;
            }
        });
    }

    async function updateSampai() {
        const no = document.getElementById('inputNo').value;
        const tgl = document.getElementById('inputTglSampai').value;
        const btn = document.getElementById('btnUpdate');
        
        if(!no || !tgl) { alert("Pilih Resi dan Tanggal Sampai terlebih dahulu!"); return; }
        
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
        btn.disabled = true;
        
        try {
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'update_sampai', no: no, tanggal_sampai: tgl }),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            });
            alert("Data berhasil diupdate!");
            
            // Reload UI
            document.getElementById('trackingList').innerHTML = `<div class="loading-screen"><i class="fa-solid fa-spinner fa-spin"></i> Memuat ulang...</div>`;
            await loadData(); 
            document.getElementById('inputTglSampai').value = '';
            
        } catch(e) {
            alert("Gagal update data!");
        }
        
        btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Konfirmasi Sampai';
        btn.disabled = false;
    }

    function shareWhatsApp() {
        // Format pesan rapi untuk WhatsApp
        let text = `*REPORT MATERIAL ONSITE* 🏗️\n`;
        text += `Tanggal: ${new Date().toLocaleDateString('id-ID')}\n\n`;
        text += `📊 *REKAPITULASI:*\n`;
        text += `- Target Pesanan : *${rekapData.target.toFixed(2)} m2*\n`;
        text += `- Sudah Diterima : *${rekapData.terkumpul.toFixed(2)} m2*\n`;
        text += `- Sisa Kekurangan: *${rekapData.sisa.toFixed(2)} m2*\n\n`;
        
        text += `🚚 *SEDANG DALAM PERJALANAN (IN TRANSIT):*\n`;
        let countOtw = 0;
        dataPengiriman.forEach(row => {
            if(row['NO'] && row['TANGGAL SAMPAI'] === "") {
                text += `> Resi #${row['NO']} | Plat ${row['PLAT KENDARAAN']} (${row['JUMLAH']} m2)\n`;
                countOtw++;
            }
        });
        if(countOtw === 0) text += `> _Tidak ada pengiriman berjalan saat ini._\n`;

        text += `\n_Di-generate otomatis dari Dashboard MaterialTrack_`;

        // URL Encode & Buka WA
        const waLink = `https://wa.me/?text=${encodeURIComponent(text)}`;
        window.open(waLink, '_blank');
    }

    // Init
    window.onload = loadData;
</script>
</body>
</html>
