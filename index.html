<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaterialTrack - Diagram Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f1f5f9; --card-bg: rgba(255, 255, 255, 0.98);
            --primary: #2563eb; --primary-hover: #1d4ed8;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --purple: #8b5cf6;
            --text-main: #0f172a; --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg-color);
            margin: 0; padding: 20px; color: var(--text-main);
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        /* Navbar & Button Action */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; flex-wrap: wrap; gap: 15px;}
        .navbar .logo { font-size: 22px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        .nav-actions { display: flex; gap: 10px; flex-wrap: wrap;}
        .btn-add { color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; font-size: 13px;}
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .btn-blue { background: var(--primary); }
        .btn-purple { background: var(--purple); }
        .btn-green { background: var(--success); }

        /* General Stats Grid (Overview) */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); padding: 18px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; align-items: center; gap: 15px; }
        .stat-icon { width: 55px; height: 55px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 24px; flex-shrink: 0;}
        .bg-blue { background: #eff6ff; color: var(--primary); }
        .bg-green { background: #ecfdf5; color: var(--success); }
        .bg-yellow { background: #fffbeb; color: var(--warning); }
        .bg-purple { background: #faf5ff; color: var(--purple); }
        
        .stat-info h3 { margin: 0; font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom:5px;}
        .stat-list { font-size: 26px; font-weight: 800; color: var(--text-main); }

        /* MAP UI */
        .map-section { background: #0f172a; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin-bottom: 25px; position: relative; overflow: hidden; }
        .map-header { font-weight: 700; margin-bottom: 20px; color: #f8fafc; display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
        .map-container { position: relative; height: 120px; background: #1e293b; border-radius: 16px; border: 1px solid #334155; display: flex; align-items: center; }
        .map-node { position: absolute; width: 70px; height: 70px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5; font-size: 11px; font-weight: 700; color: white; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .node-supplier { left: 30px; background: linear-gradient(135deg, #3b82f6, #1e3a8a); border: 2px solid #60a5fa; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .node-site { right: 30px; background: linear-gradient(135deg, #10b981, #064e3b); border: 2px solid #34d399; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
        .map-route { position: absolute; left: 100px; right: 100px; height: 3px; background: rgba(255,255,255,0.05); }
        .map-route-dash { width: 100%; height: 100%; background: repeating-linear-gradient(90deg, #3b82f6 0, #3b82f6 10px, transparent 10px, transparent 20px); animation: moveRoute 1s linear infinite; }
        @keyframes moveRoute { from { background-position: 0 0; } to { background-position: -20px 0; } }

        .modern-truck { position: absolute; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 8px; z-index: 10; }
        .truck-icon { background: #1e293b; color: #60a5fa; padding: 8px; border-radius: 50%; border: 2px solid #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.5); }
        .truck-label { background: rgba(15, 23, 42, 0.85); color: #f8fafc; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid #334155; backdrop-filter: blur(4px); white-space: nowrap; }
        .truck-otw { animation: modernDrive 8s linear infinite; }
        @keyframes modernDrive { 0% { left: 2%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { left: 90%; opacity: 0; } }

        /* Layout & Panel */
        .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        .panel { background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .tracking-panel { max-height: 60vh; overflow-y: auto; }
        .tracking-item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 15px; background:#fff;}
        .truck-header { display: flex; justify-content: space-between; border-bottom: 1px dashed #cbd5e1; padding-bottom: 12px; margin-bottom: 12px;}
        
        /* Modals & Diagram UI */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-overlay.active { display: flex; animation: fadeIn 0.2s; }
        .modal-content { background: white; width: 100%; max-width: 500px; padding: 30px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;}
        
        /* Modal Lebar Khusus Diagram */
        .modal-large { max-width: 800px; }

        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px;}
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #94a3b8; }
        
        /* Modern Progress Diagram Cards */
        .diag-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 15px; transition: 0.3s;}
        .diag-item:hover { border-color: #cbd5e1; box-shadow: 0 5px 15px rgba(0,0,0,0.05);}
        .diag-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 700; color: #0f172a; font-size: 15px;}
        
        .diag-bar-bg { width: 100%; height: 12px; background: #e2e8f0; border-radius: 6px; overflow: hidden; display: flex; margin-bottom: 12px;}
        .diag-fill-sampai { height: 100%; background: var(--success); transition: 1s ease-out;}
        .diag-fill-otw { height: 100%; background: var(--warning); transition: 1s ease-out;}
        
        .diag-stats { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600;}
        .d-box { padding: 6px 12px; border-radius: 6px; border: 1px solid #e2e8f0; display:flex; flex-direction:column; align-items:center; flex:1; margin:0 5px;}
        .d-box span { font-size: 10px; color: #64748b; text-transform: uppercase; margin-bottom: 3px;}
        .d-target { background: #eff6ff; color: var(--primary); border-color: #bfdbfe;}
        .d-sampai { background: #ecfdf5; color: var(--success); border-color: #a7f3d0;}
        .d-otw { background: #fffbeb; color: var(--warning); border-color: #fde68a;}
        .d-sisa { background: #faf5ff; color: var(--purple); border-color: #e9d5ff;}

        label { font-size: 13px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; background:#f8fafc; box-sizing: border-box;}
        .form-row { display: flex; gap: 15px; }
        button.action-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition:0.3s; margin-bottom:10px;}
        .btn-whatsapp { background: #25D366; color: white; margin-top:20px; }

        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
        
        .tabs { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; padding: 10px 15px; font-weight: 600; color: #64748b; cursor: pointer; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .diag-stats { flex-wrap: wrap; }
            .d-box { min-width: 40%; margin-bottom: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <div class="logo"><i class="fa-solid fa-layer-group"></i> MaterialTrack Pro</div>
        <div class="nav-actions">
            <button class="btn-add btn-purple" onclick="openModal('pesananModal')"><i class="fa-solid fa-cart-plus"></i> Target Pesanan</button>
            <button class="btn-add btn-blue" onclick="openModal('addModal')"><i class="fa-solid fa-truck"></i> Input DO Pengiriman</button>
        </div>
    </div>

    <!-- GENERAL OVERVIEW STATS (Tidak membedakan satuan, murni performa logistic) -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon bg-blue"><i class="fa-solid fa-cubes"></i></div>
            <div class="stat-info">
                <h3>Jenis Material</h3>
                <div class="stat-list" id="statJenis">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-green"><i class="fa-solid fa-flag-checkered"></i></div>
            <div class="stat-info">
                <h3>Item Komplit Selesai</h3>
                <div class="stat-list" id="statSelesai">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-purple"><i class="fa-solid fa-truck-ramp-box"></i></div>
            <div class="stat-info">
                <h3>Total Truk Sampai</h3>
                <div class="stat-list" id="statTrukSampai">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon bg-yellow"><i class="fa-solid fa-truck-moving"></i></div>
            <div class="stat-info">
                <h3>Truk Sedang OTW</h3>
                <div class="stat-list" id="statTrukOtw">0</div>
            </div>
        </div>
    </div>

    <!-- MODERN TOP-DOWN MAP -->
    <div class="map-section">
        <div class="map-header">
            <div><i class="fa-solid fa-satellite-dish fa-beat" style="color: #34d399;"></i> Live Logistic Network</div>
            <!-- TOMBOL BUKA DIAGRAM -->
            <button class="btn-add btn-green" onclick="openModal('diagramModal')" style="box-shadow: 0 0 15px rgba(16,185,129,0.4);"><i class="fa-solid fa-chart-pie"></i> Buka Diagram Detail Material</button>
        </div>
        <div class="map-container">
            <div class="map-node node-supplier"><i class="fa-solid fa-industry fa-lg" style="margin-bottom: 4px;"></i> Supplier</div>
            <div class="map-route"><div class="map-route-dash"></div></div>
            <div id="modernMapTrucks"></div>
            <div class="map-node node-site"><i class="fa-solid fa-person-digging fa-lg" style="margin-bottom: 4px;"></i> Onsite</div>
        </div>
    </div>

    <!-- Tracking List & Actions -->
    <div class="main-grid">
        <div class="panel tracking-panel" id="trackingList">
            <div style="text-align:center; padding:40px; color:var(--primary);"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><br>Sinkronisasi Database...</div>
        </div>

        <div class="panel">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('tab-sampai', this)">Konfirmasi Sampai</button>
                <button class="tab-btn" onclick="switchTab('tab-edit', this)">Edit Resi</button>
            </div>

            <div id="tab-sampai" class="tab-content active">
                <label>Pilih Truk (Resi)</label>
                <select id="selResiSampai"></select>
                <label>Tanggal Sampai Onsite</label>
                <input type="date" id="inTglSampai">
                <button class="action-btn btn-green" onclick="updateSampai()" id="btnSampai">
                    <i class="fa-solid fa-check"></i> Tandai Barang Sampai
                </button>
            </div>

            <div id="tab-edit" class="tab-content">
                <label>Pilih Resi Yang Salah</label>
                <select id="selResiEdit" onchange="loadEditForm()"></select>
                <div style="background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom: 10px;">
                    <label>No Resi</label><input type="text" id="edNo">
                    <div class="form-row">
                        <div style="flex:2"><label>Jumlah</label><input type="number" id="edJml" step="0.01"></div>
                        <div style="flex:1"><label>Satuan</label><input type="text" id="edSat"></div>
                    </div>
                    <label>Plat</label><input type="text" id="edPlat">
                </div>
                <button class="action-btn" style="background:var(--warning); color:white;" onclick="simpanEdit()" id="btnEdit">
                    <i class="fa-solid fa-pen"></i> Simpan Perubahan
                </button>
            </div>

            <button class="action-btn btn-whatsapp" onclick="shareWhatsApp()">
                <i class="fa-brands fa-whatsapp fa-lg"></i> Share Laporan WhatsApp
            </button>
        </div>
    </div>
</div>

<!-- ================= MODAL 1: INPUT PENGIRIMAN ================= -->
<div class="modal-overlay" id="addModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0; color:var(--primary);"><i class="fa-solid fa-truck-ramp-box"></i> Input Pengiriman Baru (DO)</h3>
            <button class="close-btn" onclick="closeModal('addModal')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>No Resi / DO</label><input type="text" id="addNo" placeholder="Contoh: DO-01"></div>
            <div style="flex:1;"><label>Tanggal Berangkat</label><input type="date" id="addTgl"></div>
        </div>
        <label>Item Material</label>
        <input type="text" id="addItem" placeholder="Contoh: UDITCH 60x60">
        <label>Mutu</label>
        <input type="text" id="addMutu" placeholder="Contoh: K350">
        <div class="form-row">
            <div style="flex:2;"><label>Jumlah</label><input type="number" id="addJumlah" step="0.01"></div>
            <div style="flex:1;"><label>Satuan</label><input type="text" id="addSatuan"></div>
        </div>
        <div class="form-row">
            <div style="flex:1;"><label>Nama Pengemudi</label><input type="text" id="addSopir"></div>
            <div style="flex:1;"><label>Plat Kendaraan</label><input type="text" id="addPlat"></div>
        </div>
        <button class="action-btn btn-blue" onclick="submitPengirimanBaru()" id="btnAddSubmit" style="margin-top:10px;">
            <i class="fa-solid fa-paper-plane"></i> Kirim Data Resi
        </button>
    </div>
</div>

<!-- ================= MODAL 2: INPUT TARGET PESANAN ================= -->
<div class="modal-overlay" id="pesananModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0; color:var(--purple);"><i class="fa-solid fa-cart-plus"></i> Input Master Target</h3>
            <button class="close-btn" onclick="closeModal('pesananModal')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <label>Nama Item Material (Base)</label>
        <input type="text" id="pesananItem" placeholder="Contoh: UDITCH 60x60">
        <div class="form-row">
            <div style="flex:2;"><label>Total Target</label><input type="number" id="pesananJumlah" step="0.01"></div>
            <div style="flex:1;"><label>Satuan</label><input type="text" id="pesananSatuan"></div>
        </div>
        <button class="action-btn" style="background:var(--purple); color:white; margin-top:10px;" onclick="submitPesananBaru()" id="btnPesananSubmit">
            <i class="fa-solid fa-save"></i> Simpan Target Pesanan
        </button>
    </div>
</div>

<!-- ================= MODAL 3: DIAGRAM DETAIL PER ITEM ================= -->
<div class="modal-overlay" id="diagramModal">
    <div class="modal-content modal-large">
        <div class="modal-header" style="position:sticky; top:-30px; background:white; z-index:10; padding-top:30px; margin-top:-30px;">
            <h3 style="margin:0; color:var(--text-main); font-size:18px;"><i class="fa-solid fa-chart-bar" style="color:var(--primary);"></i> Progress & Sisa Per Item Material</h3>
            <button class="close-btn" onclick="closeModal('diagramModal')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div id="diagramContainer">
            <div style="text-align:center; padding:20px; color:#94a3b8;"><i class="fa-solid fa-spinner fa-spin"></i> Menghitung Kalkulasi...</div>
        </div>
    </div>
</div>

<script>
    // MASUKKAN URL APPS SCRIPT ANDA DI BAWAH INI
    const API_URL = 'https://script.google.com/macros/s/AKfycbx1sqFB04reLD2XM9CFJUITXSyP50hizXX4TsYfflOx9Q6SuEp0mFzuF7YfuskXWa97/exec'; 

    let dataPengiriman = [];
    let dataPesanan = [];
    let itemStats = {}; // Akan menyimpan rekap PER ITEM murni (bukan per satuan)

    async function init() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            dataPengiriman = data.pengiriman;
            dataPesanan = data.pesanan;
            
            calculatePerItemStats();
            renderModernMap();
            renderTrackingUI();
            populateDropdowns();
        } catch (e) {
            document.getElementById('trackingList').innerHTML = `<div style="color:red; text-align:center;">Gagal Terhubung. Cek URL API.</div>`;
        }
    }

    // ==========================================
    // LOGIKA PERHITUNGAN MURNI PER ITEM
    // ==========================================
    function calculatePerItemStats() {
        itemStats = {};
        let totalJenis = 0;
        let totalTrukSampai = 0;
        let totalTrukOtw = 0;
        let totalSelesai = 0;

        // 1. Ambil data dari Master Pesanan (Berdasarkan NAMA ITEM)
        dataPesanan.forEach(p => {
            let itemName = (p['ITEM'] || '').trim().toUpperCase();
            if(!itemName) return;
            
            if(!itemStats[itemName]) {
                itemStats[itemName] = { target: 0, sampai: 0, otw: 0, sisa: 0, satuan: p['SATUAN'] || 'unit' };
                totalJenis++;
            }
            itemStats[itemName].target += parseFloat(p['TOTAL PESANAN']) || 0;
        });

        // 2. Tambahkan data dari Pengiriman (Cocokkan dengan NAMA ITEM)
        dataPengiriman.forEach(row => {
            if(!row['NO']) return;
            let itemName = (row['ITEM'] || '').trim().toUpperCase();
            
            // Jika ada barang dikirim yang belum ada di target, tetap munculkan
            if(!itemStats[itemName]) {
                itemStats[itemName] = { target: 0, sampai: 0, otw: 0, sisa: 0, satuan: row['SATUAN'] || 'unit' };
                totalJenis++;
            }
            
            let jumlah = parseFloat(row['JUMLAH']) || 0;
            if(row['TANGGAL SAMPAI'] !== "") {
                itemStats[itemName].sampai += jumlah;
                totalTrukSampai++;
            } else {
                itemStats[itemName].otw += jumlah;
                totalTrukOtw++;
            }
        });

        // 3. Render Top Overview Grid & Siapkan Data untuk Diagram
        for(let key in itemStats) {
            let s = itemStats[key];
            s.sisa = s.target - (s.sampai + s.otw);
            if(s.sisa < 0) s.sisa = 0;
            
            // Cek apakah item ini sudah 100% selesai
            if(s.target > 0 && s.sampai >= s.target) {
                totalSelesai++;
            }
        }

        document.getElementById('statJenis').innerText = totalJenis;
        document.getElementById('statSelesai').innerText = totalSelesai;
        document.getElementById('statTrukSampai').innerText = totalTrukSampai;
        document.getElementById('statTrukOtw').innerText = totalTrukOtw;

        // 4. Render Diagram Detail
        renderDiagrams();
    }

    // ==========================================
    // RENDER DIAGRAM PROGRESS PER ITEM
    // ==========================================
    function renderDiagrams() {
        const container = document.getElementById('diagramContainer');
        container.innerHTML = '';
        
        let hasData = false;
        
        for(let item in itemStats) {
            hasData = true;
            let s = itemStats[item];
            let sat = s.satuan.toLowerCase();
            
            // Hitung Persentase (Maksimal 100%)
            let safeTarget = s.target > 0 ? s.target : (s.sampai + s.otw) || 1; // Cegah div/0
            let pctSampai = (s.sampai / safeTarget) * 100;
            let pctOtw = (s.otw / safeTarget) * 100;
            
            // Batasi persentase visual mentok di 100 agar grafik tidak pecah
            if(pctSampai > 100) pctSampai = 100;
            if((pctSampai + pctOtw) > 100) pctOtw = 100 - pctSampai;

            // Indikator Status
            let statusText = "";
            if(s.target > 0 && s.sampai >= s.target) {
                statusText = `<span style="color:var(--success); font-size:12px;"><i class="fa-solid fa-circle-check"></i> Selesai 100%</span>`;
            } else if (s.target == 0) {
                statusText = `<span style="color:var(--warning); font-size:12px;">! Target Belum Diatur</span>`;
            } else {
                statusText = `<span style="color:var(--text-muted); font-size:12px;">Progress: ${pctSampai.toFixed(1)}%</span>`;
            }

            container.innerHTML += `
                <div class="diag-item">
                    <div class="diag-header">
                        <div><i class="fa-solid fa-cube" style="color:#94a3b8; margin-right:5px;"></i> ${item}</div>
                        ${statusText}
                    </div>
                    
                    <div class="diag-bar-bg">
                        <div class="diag-fill-sampai" style="width: ${pctSampai}%;"></div>
                        <div class="diag-fill-otw" style="width: ${pctOtw}%;"></div>
                    </div>
                    
                    <div class="diag-stats">
                        <div class="d-box d-target">
                            <span>Target</span>
                            <b>${s.target.toLocaleString('id-ID')} ${sat}</b>
                        </div>
                        <div class="d-box d-sampai">
                            <span>Sampai Site</span>
                            <b>${s.sampai.toLocaleString('id-ID')} ${sat}</b>
                        </div>
                        <div class="d-box d-otw">
                            <span>Dalam Jalan (OTW)</span>
                            <b>${s.otw.toLocaleString('id-ID')} ${sat}</b>
                        </div>
                        <div class="d-box d-sisa">
                            <span>Sisa Pabrik</span>
                            <b>${s.sisa.toLocaleString('id-ID')} ${sat}</b>
                        </div>
                    </div>
                </div>
            `;
        }
        
        if(!hasData) container.innerHTML = `<div style="text-align:center; color:#94a3b8;">Belum ada data pesanan/pengiriman.</div>`;
    }

    function renderModernMap() {
        const truckContainer = document.getElementById('modernMapTrucks');
        truckContainer.innerHTML = ''; 
        let otwCount = 0;
        dataPengiriman.forEach((row) => {
            if(!row['NO'] || row['TANGGAL SAMPAI'] !== "") return;
            const delay = (otwCount * 2.5); 
            truckContainer.innerHTML += `
                <div class="modern-truck truck-otw" style="animation-delay: -${delay}s;">
                    <div class="truck-icon"><i class="fa-solid fa-truck-moving"></i></div>
                    <div class="truck-label">${row['PLAT KENDARAAN']} <span style="color:#60a5fa;">(${row['JUMLAH']}${row['SATUAN']})</span></div>
                </div>
            `;
            otwCount++;
        });
    }

    function renderTrackingUI() {
        const container = document.getElementById('trackingList');
        container.innerHTML = ''; 
        const sortedData = [...dataPengiriman].reverse();
        sortedData.forEach(row => {
            if(!row['NO']) return;
            const isArrived = row['TANGGAL SAMPAI'] !== "";
            container.innerHTML += `
                <div class="tracking-item">
                    <div class="truck-header">
                        <strong style="color:var(--primary); font-size:15px;">#${row['NO']} - ${row['ITEM']}</strong>
                        ${isArrived ? '<span style="background:#ecfdf5; color:var(--success); padding:4px 10px; border-radius:8px; font-size:12px; font-weight:bold;">Terkirim</span>' : '<span style="background:#fffbeb; color:var(--warning); padding:4px 10px; border-radius:8px; font-size:12px; font-weight:bold;">OTW</span>'}
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted);">
                        <div><i class="fa-solid fa-user-tie"></i> ${row['NAMA PENGEMUDI']}</div>
                        <div><i class="fa-solid fa-car"></i> <b>${row['PLAT KENDARAAN']}</b></div>
                        <div><i class="fa-solid fa-cube"></i> <b>${row['JUMLAH']} ${row['SATUAN']}</b></div>
                    </div>
                </div>
            `;
        });
    }

    function populateDropdowns() {
        const selS = document.getElementById('selResiSampai');
        const selE = document.getElementById('selResiEdit');
        selS.innerHTML = '<option value="">-- Pilih Truk (Status OTW) --</option>';
        selE.innerHTML = '<option value="">-- Pilih Resi Untuk Edit --</option>';
        dataPengiriman.forEach(row => {
            if(!row['NO']) return;
            let text = `${row['NO']} - ${row['PLAT KENDARAAN']} (${row['JUMLAH']} ${row['SATUAN']})`;
            if(row['TANGGAL SAMPAI'] === "") selS.innerHTML += `<option value="${row['NO']}">${text}</option>`;
            selE.innerHTML += `<option value="${row['NO']}">${text}</option>`;
        });
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function switchTab(t, el) {
        document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
        document.getElementById(t).classList.add('active');
        el.classList.add('active');
    }

    function loadEditForm() {
        let r = dataPengiriman.find(x => x['NO'] == document.getElementById('selResiEdit').value);
        if(r) {
            document.getElementById('edNo').value = r['NO'];
            document.getElementById('edJml').value = r['JUMLAH'];
            document.getElementById('edSat').value = r['SATUAN'];
            document.getElementById('edPlat').value = r['PLAT KENDARAAN'];
        }
    }

    async function reqApi(payload, btnId, lText, oText) {
        let btn = document.getElementById(btnId);
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${lText}...`; btn.disabled = true;
        try {
            await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), headers: { "Content-Type": "text/plain;charset=utf-8" } });
            alert("Berhasil!"); await init(); 
        } catch(e) { alert("Error Server!"); }
        btn.innerHTML = oText; btn.disabled = false;
    }

    function updateSampai() {
        let no = document.getElementById('selResiSampai').value, tgl = document.getElementById('inTglSampai').value;
        if(!no || !tgl) return alert("Pilih Resi dan Tanggal!");
        reqApi({action:'update_sampai', no:no, tanggal_sampai:tgl}, 'btnSampai', 'Loading', '<i class="fa-solid fa-check"></i> Tandai Barang Sampai');
    }

    function simpanEdit() {
        let lama = document.getElementById('selResiEdit').value;
        if(!lama) return alert("Pilih resi!");
        reqApi({
            action: 'edit_resi', no_lama: lama, no_baru: document.getElementById('edNo').value,
            jumlah: document.getElementById('edJml').value, satuan: document.getElementById('edSat').value,
            plat: document.getElementById('edPlat').value
        }, 'btnEdit', 'Menyimpan', '<i class="fa-solid fa-pen"></i> Simpan Perubahan');
    }

    function submitPengirimanBaru() {
        let no = document.getElementById('addNo').value;
        if(!no) return alert("No Resi Wajib Diisi!");
        let payload = {
            action: 'tambah_resi', no: no, tgl_berangkat: document.getElementById('addTgl').value,
            item: document.getElementById('addItem').value, mutu: document.getElementById('addMutu').value,
            jumlah: document.getElementById('addJumlah').value, satuan: document.getElementById('addSatuan').value,
            pengemudi: document.getElementById('addSopir').value, plat: document.getElementById('addPlat').value
        };
        reqApi(payload, 'btnAddSubmit', 'Menyimpan', '<i class="fa-solid fa-paper-plane"></i> Kirim Data Resi').then(() => {
            closeModal('addModal'); document.querySelectorAll('#addModal input').forEach(inp => inp.value = '');
        });
    }

    function submitPesananBaru() {
        let item = document.getElementById('pesananItem').value;
        let target = document.getElementById('pesananJumlah').value;
        let sat = document.getElementById('pesananSatuan').value;
        if(!item || !target || !sat) return alert("Semua kolom Master Pesanan wajib diisi!");
        let payload = { action: 'tambah_pesanan', item: item, total_pesanan: target, satuan: sat };
        reqApi(payload, 'btnPesananSubmit', 'Menyimpan Base', '<i class="fa-solid fa-save"></i> Simpan Target Pesanan').then(() => {
            closeModal('pesananModal'); document.querySelectorAll('#pesananModal input').forEach(inp => inp.value = '');
        });
    }

    function shareWhatsApp() {
        let text = `*🚧 REPORT LOGISTIK ONSITE*\nTanggal: ${new Date().toLocaleDateString('id-ID')}\n\n`;
        text += `*📊 PROGRESS MATERIAL PER ITEM:*\n`;
        
        let i = 1;
        for(let key in itemStats) {
            let s = itemStats[key];
            text += `*${i}. ${key}*\n`;
            text += ` 🎯 Target : ${s.target.toLocaleString('id-ID')} ${s.satuan}\n`;
            text += ` ✅ Sampai : ${s.sampai.toLocaleString('id-ID')} ${s.satuan}\n`;
            text += ` 🚚 OTW    : ${s.otw.toLocaleString('id-ID')} ${s.satuan}\n`;
            text += ` ⏳ Sisa   : ${s.sisa.toLocaleString('id-ID')} ${s.satuan}\n\n`;
            i++;
        }
        
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    window.onload = init;
</script>
</body>
</html>
